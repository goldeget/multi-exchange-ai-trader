name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/setup-python v7.1.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      # astral-sh/setup-uv v10.3.3
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.12.23"
          enable-cache: false

      - name: Install locked Python dependencies
        run: uv sync --locked

      - name: Run Python tests
        run: uv run pytest -q

      - name: Run Ruff
        run: uv run ruff check src tests scripts

      - name: Run mypy
        run: uv run mypy src scripts

  native-contracts:
    name: Native execution contracts (network isolated)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.12.23"
          enable-cache: false
      - name: Install exact locked native wheel
        run: uv sync --locked
      - name: Require OS network isolation and actual native contracts
        run: |
          command -v unshare
          sudo unshare --net -- env -i PATH="$PATH" LD_LIBRARY_PATH="${LD_LIBRARY_PATH:-}" LANG=C.UTF-8 PYTHONPATH="$PWD/src" REQUIRE_NATIVE_CONTRACTS=1 NATIVE_NETWORK_ISOLATED=1 OPENBLAS_NUM_THREADS=1 "$PWD/.venv/bin/python" -m pytest -q tests/execution/test_bybit_native_linux.py tests/execution/test_native_node_linux.py tests/execution/test_native_capabilities_linux.py tests/execution/test_execution_provenance_linux.py tests/execution/test_native_recovery_linux.py --junitxml=native-contracts.xml
      - name: Reject empty or skipped native qualification
        run: |
          .venv/bin/python - <<'PY'
          import xml.etree.ElementTree as ET
          suites = list(ET.parse("native-contracts.xml").getroot().iter("testsuite"))
          total = sum(int(s.attrib.get("tests", 0)) for s in suites)
          skipped = sum(int(s.attrib.get("skipped", 0)) for s in suites)
          failures = sum(int(s.attrib.get("failures", 0)) + int(s.attrib.get("errors", 0)) for s in suites)
          if total != 36 or skipped or failures:
              raise SystemExit("Native contracts require all 36 unskipped passing cases")
          expected_modules = {
              "test_native_capabilities_linux": 12,
              "test_execution_provenance_linux": 3,
              "test_native_recovery_linux": 2,
          }
          for module_name, expected in expected_modules.items():
              observed = sum(
                  case.attrib.get("classname", "").split(".")[-1] == module_name
                  for suite in suites for case in suite.iter("testcase")
              )
              if observed != expected:
                  raise SystemExit(f"{module_name} requires exactly {expected} passing cases")
          print(f"Verified {total} actual native contract tests without network access")
          PY
      - name: Require isolated actual native restart contracts
        run: |
          command -v unshare
          sudo unshare --net -- env -i PATH="$PATH" LD_LIBRARY_PATH="${LD_LIBRARY_PATH:-}" LANG=C.UTF-8 PYTHONPATH="$PWD/src" REQUIRE_NATIVE_CONTRACTS=1 NATIVE_NETWORK_ISOLATED=1 OPENBLAS_NUM_THREADS=1 "$PWD/.venv/bin/python" -m pytest -q tests/execution/test_native_restart_linux.py --junitxml=native-restart-contracts.xml
      - name: Reject empty or skipped native restart qualification
        run: |
          .venv/bin/python - <<'PY'
          import xml.etree.ElementTree as ET
          suites = list(ET.parse("native-restart-contracts.xml").getroot().iter("testsuite"))
          total = sum(int(s.attrib.get("tests", 0)) for s in suites)
          skipped = sum(int(s.attrib.get("skipped", 0)) for s in suites)
          failures = sum(int(s.attrib.get("failures", 0)) + int(s.attrib.get("errors", 0)) for s in suites)
          cases = [case for suite in suites for case in suite.iter("testcase")]
          if (total != 6 or len(cases) != 6 or skipped or failures
                  or any(case.attrib.get("classname", "").split(".")[-1]
                         != "test_native_restart_linux" for case in cases)):
              raise SystemExit("Native restart contracts require exactly 6 unskipped passing cases")
          print("Verified 6 actual native restart contracts without network access")
          PY
      - name: Require isolated actual restored monitoring contracts
        run: |
          command -v unshare
          sudo unshare --net -- env -i PATH="$PATH" LD_LIBRARY_PATH="${LD_LIBRARY_PATH:-}" LANG=C.UTF-8 PYTHONPATH="$PWD/src" REQUIRE_NATIVE_CONTRACTS=1 NATIVE_NETWORK_ISOLATED=1 OPENBLAS_NUM_THREADS=1 "$PWD/.venv/bin/python" -m pytest -q tests/execution/test_restored_monitoring_linux.py --junitxml=restored-monitoring-contracts.xml
      - name: Require all thirteen exact restored monitoring contracts
        run: |
          .venv/bin/python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("restored-monitoring-contracts.xml").getroot()
          suites, cases = list(root.iter("testsuite")), list(root.iter("testcase"))
          expected = {
              "test_actual_restored_lifecycle_and_one_shot_admission",
              "test_issued_t4_receipt_rejects_extra_native_get_before_send",
              "test_readonly_binding_without_capital_or_trading_permission",
              "test_forged_stale_phase_and_budget_receipts_cannot_admit",
              "test_all_financial_and_reconciliation_fences",
              "test_ack_pong_modes_and_transport_epoch_are_required",
              "test_original_owned_execution_reaches_native_and_app_quarantine",
              "test_pending_applied_duplicates_and_original_field_guards",
              "test_partial_terminal_ordering_never_infers_execution",
              "test_pre_post_mutation_and_final_delivery_barrier",
              "test_cancel_stop_reauthentication_and_lease_fences",
              "test_real_shutdown_quiesces_without_closing_shared_loop",
              "test_live_fill_stales_proof_fault_requires_new_admission_and_seals",
          }
          total = sum(int(s.attrib.get("tests", 0)) for s in suites)
          bad = sum(int(s.attrib.get(key, 0)) for s in suites for key in ("skipped", "errors", "failures"))
          names = [case.attrib.get("name", "") for case in cases]
          if (total != 13 or len(cases) != 13 or bad or len(set(names)) != 13
                  or set(names) != expected
                  or any(case.attrib.get("classname", "").split(".")[-1]
                         != "test_restored_monitoring_linux" for case in cases)
                  or any(list(case.iter(tag)) for case in cases for tag in ("skipped", "failure", "error"))):
              raise SystemExit("Restored monitoring requires exactly 13 named unskipped passing cases")
          print("Verified 13 actual restored monitoring contracts without network access")
          PY
      - name: Require isolated actual fresh monitoring bootstrap contracts
        run: |
          command -v unshare
          sudo unshare --net -- env -i PATH="$PATH" LD_LIBRARY_PATH="${LD_LIBRARY_PATH:-}" LANG=C.UTF-8 PYTHONPATH="$PWD/src" REQUIRE_NATIVE_CONTRACTS=1 NATIVE_NETWORK_ISOLATED=1 OPENBLAS_NUM_THREADS=1 "$PWD/.venv/bin/python" -m pytest -q tests/execution/test_fresh_monitoring_linux.py --junitxml=fresh-monitoring-contracts.xml
      - name: Require all eight exact fresh monitoring bootstrap contracts
        run: |
          .venv/bin/python - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          root = ET.parse("fresh-monitoring-contracts.xml").getroot()
          suites, cases = list(root.iter("testsuite")), list(root.iter("testcase"))
          expected = {
              "test_actual_fresh_bootstrap_installs_provider_metadata_and_streams_once",
              "test_actual_fresh_origin_rejects_copied_foreign_and_restored_sources",
              "test_actual_fresh_bootstrap_rejects_nonempty_application_or_native_cache",
              "test_actual_fresh_bootstrap_preserves_pre_post_and_whole_account_flatness",
              "test_actual_fresh_bootstrap_rejects_metadata_drift_and_stale_sources",
              "test_actual_fresh_bootstrap_stop_reauthentication_and_owner_fences",
              "test_actual_fresh_bootstrap_drain_failure_retains_original_resources",
              "test_actual_fresh_bootstrap_keeps_all_financial_writers_blocked",
          }
          def counter(suite, name):
              value = suite.attrib.get(name)
              if type(value) is not str or re.fullmatch(r"0|[1-9][0-9]{0,8}", value) is None:
                  raise SystemExit("Fresh monitoring requires bounded nonnegative XML counters")
              return int(value)
          total = sum(counter(s, "tests") for s in suites)
          bad = sum(counter(s, key) for s in suites for key in ("skipped", "errors", "failures"))
          names = [case.attrib.get("name", "") for case in cases]
          if (total != 8 or len(cases) != 8 or bad or len(set(names)) != 8 or set(names) != expected
                  or any(case.attrib.get("classname", "").split(".")[-1]
                         != "test_fresh_monitoring_linux" for case in cases)
                  or any(list(case.iter(tag)) for case in cases for tag in ("skipped", "failure", "error"))):
              raise SystemExit("Fresh monitoring requires exactly eight named unskipped passing cases")
          print("Verified eight actual fresh monitoring contracts without network access")
          PY
      - name: Require isolated selected-scope observation contracts
        run: |
          command -v unshare
          sudo unshare --net -- env -i PATH="$PATH" LD_LIBRARY_PATH="${LD_LIBRARY_PATH:-}" LANG=C.UTF-8 PYTHONPATH="$PWD/src" REQUIRE_NATIVE_CONTRACTS=1 NATIVE_NETWORK_ISOLATED=1 OPENBLAS_NUM_THREADS=1 "$PWD/.venv/bin/python" -m pytest -q tests/execution/test_selected_scope_monitoring_linux.py --junitxml=selected-scope-observation.xml
      - name: Require three exact selected-scope observation contracts
        run: |
          .venv/bin/python - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          root = ET.parse("selected-scope-observation.xml").getroot()
          suites, cases = list(root.iter("testsuite")), list(root.iter("testcase"))
          expected = {
              "test_actual_sdk_observer_keeps_other_symbols_unmanaged_without_global_flatness",
              "test_actual_sdk_default_and_selected_activity_still_refuse_observation",
              "test_actual_sdk_observer_receipt_retains_whole_sources_and_activity_marker",
          }
          def counter(suite, name):
              value = suite.attrib.get(name)
              if type(value) is not str or re.fullmatch(r"0|[1-9][0-9]{0,8}", value) is None:
                  raise SystemExit("Selected scope requires bounded nonnegative XML counters")
              return int(value)
          total = sum(counter(s, "tests") for s in suites)
          bad = sum(counter(s, key) for s in suites for key in ("skipped", "errors", "failures"))
          names = [case.attrib.get("name", "") for case in cases]
          if (total != 3 or len(cases) != 3 or bad or len(set(names)) != 3 or set(names) != expected
                  or any(case.attrib.get("classname", "").split(".")[-1]
                         != "test_selected_scope_monitoring_linux" for case in cases)
                  or any(list(case.iter(tag)) for case in cases for tag in ("skipped", "failure", "error"))):
              raise SystemExit("Selected scope requires three exact named unskipped passing cases")
          print("Verified three actual selected-scope observation contracts without network access")
          PY
      - name: Require isolated actual observation metadata contracts
        run: |
          command -v unshare
          sudo unshare --net -- env -i PATH="$PATH" LD_LIBRARY_PATH="${LD_LIBRARY_PATH:-}" LANG=C.UTF-8 PYTHONPATH="$PWD/src" REQUIRE_NATIVE_CONTRACTS=1 NATIVE_NETWORK_ISOLATED=1 OPENBLAS_NUM_THREADS=1 "$PWD/.venv/bin/python" -m pytest -q tests/execution/test_observation_instrument_linux.py --junitxml=observation-instrument-contracts.xml
      - name: Require all six exact observation metadata contracts
        run: |
          .venv/bin/python - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          root = ET.parse("observation-instrument-contracts.xml").getroot()
          suites, cases = list(root.iter("testsuite")), list(root.iter("testcase"))
          expected = {
              "test_actual_sdk_observation_marker_survives_native_cache_codec_roundtrip",
              "test_original_session_observation_profile_never_requests_private_fees",
              "test_default_actual_fee_path_still_refuses_private_10001",
              "test_observation_public_get_failure_keeps_terminal_budget_failure",
              "test_observation_exhausted_physical_budget_sends_nothing",
              "test_actual_native_types_reject_missing_mixed_and_corrupt_metadata_markers",
          }
          def counter(suite, name):
              value = suite.attrib.get(name)
              if type(value) is not str or re.fullmatch(r"0|[1-9][0-9]{0,8}", value) is None:
                  raise SystemExit("Observation metadata requires bounded nonnegative XML counters")
              return int(value)
          total = sum(counter(s, "tests") for s in suites)
          bad = sum(counter(s, key) for s in suites for key in ("skipped", "errors", "failures"))
          names = [case.attrib.get("name", "") for case in cases]
          if (total != 6 or len(cases) != 6 or bad or len(set(names)) != 6 or set(names) != expected
                  or any(case.attrib.get("classname", "").split(".")[-1]
                         != "test_observation_instrument_linux" for case in cases)
                  or any(list(case.iter(tag)) for case in cases for tag in ("skipped", "failure", "error"))):
              raise SystemExit("Observation metadata requires exactly six named unskipped passing cases")
          print("Verified six actual observation metadata contracts without network access")
          PY
      - name: Require isolated actual fixed limit native contracts
        run: |
          command -v unshare
          sudo unshare --net -- env -i PATH="$PATH" LD_LIBRARY_PATH="${LD_LIBRARY_PATH:-}" LANG=C.UTF-8 PYTHONPATH="$PWD/src" REQUIRE_NATIVE_CONTRACTS=1 NATIVE_NETWORK_ISOLATED=1 OPENBLAS_NUM_THREADS=1 "$PWD/.venv/bin/python" -m pytest -q tests/execution/test_bybit_fixed_limit_linux.py --junitxml=fixed-limit-native-contracts.xml
      - name: Require all eight exact fixed limit native contracts
        run: |
          .venv/bin/python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("fixed-limit-native-contracts.xml").getroot()
          suites, cases = list(root.iter("testsuite")), list(root.iter("testcase"))
          expected = {
              "test_actual_limit_ioc_factory",
              "test_exact_base_quantity_and_price",
              "test_ioc_and_order_kind_revalidation",
              "test_no_bbo_or_post_only_override",
              "test_protection_and_product_binding",
              "test_ambiguous_submit_keeps_identity",
              "test_partial_and_zero_fill_keep_reservation",
              "test_restore_never_resubmits_or_reprices",
          }
          def counter(suite, key):
              value = suite.attrib.get(key)
              if (value is None or not value or len(value) > 1 or value not in "012345678"):
                  raise SystemExit("Fixed limit native counters require bounded nonnegative integers")
              return int(value)
          total = sum(counter(s, "tests") for s in suites)
          bad = any(counter(s, key) != 0 for s in suites for key in ("skipped", "errors", "failures"))
          names = [case.attrib.get("name", "") for case in cases]
          if (total != 8 or len(cases) != 8 or bad or len(set(names)) != 8 or set(names) != expected
                  or any(case.attrib.get("classname", "").split(".")[-1] != "test_bybit_fixed_limit_linux" for case in cases)
                  or any(list(root.iter(tag)) for tag in ("skipped", "failure", "error"))):
              raise SystemExit("Fixed limit native contracts require exactly eight named unskipped passing cases")
          print("Verified eight actual fixed limit native contracts without network access")
          PY
      - name: Require isolated actual prepared submit feasibility
        run: |
          command -v unshare
          sudo unshare --net -- env -i PATH="$PATH" LD_LIBRARY_PATH="${LD_LIBRARY_PATH:-}" LANG=C.UTF-8 PYTHONPATH="$PWD/src" REQUIRE_NATIVE_CONTRACTS=1 NATIVE_NETWORK_ISOLATED=1 OPENBLAS_NUM_THREADS=1 "$PWD/.venv/bin/python" -m pytest -q tests/execution/test_native_prepared_feasibility_linux.py --junitxml=native-prepared-feasibility.xml
      - name: Require both exact prepared submit feasibility cases
        run: |
          .venv/bin/python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("native-prepared-feasibility.xml").getroot()
          suites, cases = list(root.iter("testsuite")), list(root.iter("testcase"))
          expected = {
              "test_sdk_base_submit_preserves_private_order_and_original_route",
              "test_installed_node_owns_the_same_base_submit_route",
          }
          def counter(suite, key):
              value = suite.attrib.get(key)
              if value is None or len(value) != 1 or value not in "012":
                  raise SystemExit("Prepared feasibility counters require bounded ASCII integers")
              return int(value)
          total = sum(counter(s, "tests") for s in suites)
          bad = any(counter(s, key) != 0 for s in suites for key in ("skipped", "errors", "failures"))
          names = [case.attrib.get("name", "") for case in cases]
          if (root.tag != "testsuites" or len(suites) != 1 or list(root) != suites
                  or total != 2 or len(cases) != 2 or bad or len(set(names)) != 2
                  or set(names) != expected or cases != suites[0].findall("testcase")
                  or any(case.attrib.get("classname", "") != "tests.execution.test_native_prepared_feasibility_linux"
                         for case in cases)
                  or any(list(root.iter(tag)) for tag in ("skipped", "failure", "error"))):
              raise SystemExit("Prepared feasibility requires exactly two named unskipped passing cases")
          print("Verified two actual SDK prepared submit feasibility cases without network access")
          PY
      - name: Require isolated actual prepared native owners
        run: |
          command -v unshare
          sudo unshare --net -- env -i PATH="$PATH" LD_LIBRARY_PATH="${LD_LIBRARY_PATH:-}" LANG=C.UTF-8 PYTHONPATH="$PWD/src" REQUIRE_NATIVE_CONTRACTS=1 NATIVE_NETWORK_ISOLATED=1 OPENBLAS_NUM_THREADS=1 "$PWD/.venv/bin/python" -m pytest -q tests/execution/test_native_prepared_owner_linux.py --junitxml=native-prepared-owner.xml
      - name: Require all four exact prepared owner contracts
        run: |
          .venv/bin/python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("native-prepared-owner.xml").getroot()
          suites, cases = list(root.iter("testsuite")), list(root.iter("testcase"))
          expected = {
              "test_actual_entry_installation_prepares_a_private_order",
              "test_actual_prepared_handoff_uses_one_original_sdk_route",
              "test_actual_prepared_scope_rejects_cross_key_callback_reentry",
              "test_actual_prepared_owner_retirement_and_monitor_denial",
          }
          def counter(suite, key):
              value = suite.attrib.get(key)
              if value is None or len(value) != 1 or value not in "01234":
                  raise SystemExit("Prepared owner counters require bounded ASCII integers")
              return int(value)
          total = sum(counter(s, "tests") for s in suites)
          bad = any(counter(s, key) != 0 for s in suites for key in ("skipped", "errors", "failures"))
          names = [case.attrib.get("name", "") for case in cases]
          if (root.tag != "testsuites" or len(suites) != 1 or list(root) != suites
                  or total != 4 or len(cases) != 4 or bad or len(set(names)) != 4
                  or set(names) != expected or cases != suites[0].findall("testcase")
                  or any(case.attrib.get("classname", "") != "tests.execution.test_native_prepared_owner_linux"
                         for case in cases)
                  or any(list(root.iter(tag)) for tag in ("skipped", "failure", "error"))):
              raise SystemExit("Prepared owners require exactly four named unskipped passing cases")
          print("Verified four native-only prepared owner contracts without network access")
          PY
      - name: Preserve separate native qualification receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-contracts-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            native-contracts.xml
            native-restart-contracts.xml
            restored-monitoring-contracts.xml
            fresh-monitoring-contracts.xml
            selected-scope-observation.xml
            observation-instrument-contracts.xml
            fixed-limit-native-contracts.xml
          if-no-files-found: error
          retention-days: 7

      - name: Preserve separate prepared submit feasibility receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-prepared-feasibility-${{ github.sha }}
          path: native-prepared-feasibility.xml
          if-no-files-found: error
          retention-days: 7

      - name: Preserve separate prepared native owner receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-prepared-owner-${{ github.event.pull_request.head.sha || github.sha }}
          path: native-prepared-owner.xml
          if-no-files-found: error
          retention-days: 7

  operations:
    name: Linux operations checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.12.23"
          enable-cache: false
      - name: Install locked test dependencies
        run: uv sync --locked
      - name: Prepare nginx for isolated loopback tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends nginx
          if systemctl is-active --quiet nginx; then
            sudo systemctl stop nginx
          fi
      - name: Verify deployment and recovery boundaries on Linux
        env:
          REQUIRE_LINUX_OPERATIONS: "1"
        run: uv run pytest -q tests/operations

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/setup-node v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24

      - name: Install locked npm dependencies
        run: npm ci --prefix apps/web

      - name: Run frontend tests
        run: npm test --prefix apps/web -- --run

      - name: Run ESLint
        run: npm run lint --prefix apps/web

      - name: Run TypeScript check
        run: npm run typecheck --prefix apps/web

      - name: Build frontend
        run: npm run build --prefix apps/web

  browser:
    name: Browser and visual checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Install locked browser-test dependencies
        run: npm ci
      - name: Install pinned Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Verify browser behavior and exact reviewed screenshots
        run: npm run test:visual
      - name: Preserve browser proof and failure traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ui-browser-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          if-no-files-found: error
          retention-days: 7

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download Gitleaks v8.30.1
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks/gitleaks.tar.gz"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$RUNNER_TEMP/gitleaks/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks

      - name: Scan repository history for secrets
        run: |
          set +e
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact=100 --no-banner \
            --report-format=json --report-path="$RUNNER_TEMP/gitleaks-report.json" .
          scan_status=$?
          set -e
          python - "$RUNNER_TEMP/gitleaks-report.json" <<'PY_REPORT'
          import json
          import pathlib
          import sys
          report = pathlib.Path(sys.argv[1])
          if report.exists():
              for finding in json.loads(report.read_text()):
                  # Never print Finding/Secret/context; metadata only.
                  print(json.dumps({key: finding.get(key) for key in (
                      "RuleID", "File", "StartLine", "EndLine", "Commit", "Fingerprint"
                  )}))
          PY_REPORT
          exit "$scan_status"

      - name: Package verified Phase 2-A recovery snapshot
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/initial-platform'
        env:
          RECOVERY_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/phase2a-recovery"
          git update-ref refs/heads/recovery-source "$RECOVERY_SOURCE_SHA"
          git bundle create "$RUNNER_TEMP/phase2a-recovery/phase2a-recovery.bundle" refs/heads/recovery-source
          git bundle verify "$RUNNER_TEMP/phase2a-recovery/phase2a-recovery.bundle"
          git clone --quiet --bare --branch recovery-source "$RUNNER_TEMP/phase2a-recovery/phase2a-recovery.bundle" "$RUNNER_TEMP/recovery-verify.git"
          test "$(git -C "$RUNNER_TEMP/recovery-verify.git" rev-parse refs/heads/recovery-source)" = "$RECOVERY_SOURCE_SHA"
          git -C "$RUNNER_TEMP/recovery-verify.git" fsck --full --no-reflogs
          git archive --format=zip --prefix=multi-exchange-ai-trader/ --output="$RUNNER_TEMP/phase2a-recovery/phase2a-source.zip" "$RECOVERY_SOURCE_SHA"
          printf '%s\n' "$RECOVERY_SOURCE_SHA" > "$RUNNER_TEMP/phase2a-recovery/SNAPSHOT_SHA.txt"
          cd "$RUNNER_TEMP/phase2a-recovery"
          sha256sum phase2a-recovery.bundle phase2a-source.zip SNAPSHOT_SHA.txt > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      # actions/upload-artifact v7.0.2 (Node 24)
      - name: Preserve Phase 2-A recovery artifact
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/initial-platform'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: phase2a-recovery-${{ github.run_id }}
          path: ${{ runner.temp }}/phase2a-recovery/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      # actions/dependency-review-action v5.0.0
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: moderate
