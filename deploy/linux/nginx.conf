# Include this server block from the distribution nginx http {} context.
# Audit ALL enabled nginx configs: this file cannot disable other public listeners.
server {
    listen 127.0.0.1:5173 default_server;
    server_name localhost 127.0.0.1;
    root /opt/trader/app/apps/web/dist;
    index index.html;
    client_max_body_size 16k;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        # Pass exactly the original values. Never turn an untrusted Host/Origin local.
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
