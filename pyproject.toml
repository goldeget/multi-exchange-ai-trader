[project]
name = "multi-exchange-trader"
version = "0.1.0"
description = "Public market data research dashboard"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "httpx>=0.28.1,<0.29",
    "nautilus-trader==1.231.0",
    "pydantic>=2.12,<3",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1", "mypy>=1.18,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/multi_exchange_trader"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
